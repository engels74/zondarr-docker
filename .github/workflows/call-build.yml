# SPDX-License-Identifier: GPL-3.0-only
name: Publish tested image
on:
  workflow_dispatch:
    inputs:
      image:
        type: choice
        options: [release, nightly]
        required: true
permissions:
  contents: read
concurrency:
  group: publish-${{ inputs.image }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/build-on-call.yml
    with:
      image: ${{ inputs.image }}
      ref: ${{ inputs.image }}
      export_image: true
  publish:
    if: github.ref == format('refs/heads/{0}', inputs.image)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: edbfi/zondarr-docker
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: ${{ inputs.image }}-*
          path: evidence
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4.3.0
      - name: Publish tested architecture images and manifest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.image }}
        run: python3 tools/publish.py --evidence evidence --repository "$GITHUB_REPOSITORY" --branch "$IMAGE"
defaults:
  run:
    shell: bash
